[project]
name = "evideo"
version = "0.1.0"
description = "EvidEO: plain-language questions about land, answered with evidence cards from Sentinel imagery"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "pillow>=10.0",
  "rasterio>=1.3",
  # Learned land-cover instrument (zero_shot_landcover). On Linux, pip pulls CUDA wheels by default; for CPU-only
  # use: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu   (before installing this)
  "torch>=2.2",
  "torchvision>=0.17",
  "open_clip_torch>=2.24",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
geo = []  # kept so `pip install -e ".[geo]"` in older docs still works; rasterio is now a core dependency
ml = []   # kept so older docs and the Dockerfile EXTRAS still work; torch and open_clip are now core dependencies
dev = ["pytest>=8.0", "fakeredis>=2.20"]

[tool.setuptools.packages.find]
include = ["evideo*"]

[tool.setuptools.package-data]
evideo = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
